                  <tr key={r.id}>
                    <td>{r.name} <span className="tone-neutral">× {r.qty}</span><span className="sub">{r.source}</span></td>
                    <td className={`n ${b ? 'tone-' + b.tone : 'tone-neutral'}`} style={{ fontWeight:700 }}>{r.gi == null ? 'n/a' : r.gi}</td>
                    <td className="n">{fmtNum(r.avail, 'g')}</td>
                    <td className={`n ${lb ? 'tone-' + lb.tone : 'tone-neutral'}`} style={{ fontWeight:700 }}>{r.gl == null ? '—' : fmtNum(r.gl, '', 1)}</td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr><th scope="row">Meal</th>
                <td className={`n ${g.giBand ? 'tone-' + g.giBand.tone : ''}`}>{giTxt}</td>
                <td className="n">{fmtNum(g.availCarbs, 'g')}</td>
                <td className={`n ${g.glBand ? 'tone-' + g.glBand.tone : ''}`}>{g.hasRated ? fmtNum(g.gl, '', 1) : '—'}</td></tr>
            </tfoot>
            <caption>
              Sorted by glycemic load. Totals use unrounded values.
              {g.unratedCarbs >= EPS && ` ${fmtNum(g.unratedCarbs, 'g')} of available carbs come from foods with no GI value (n/a) and are left out of the meal GI.`}
            </caption>
          </table>
        </div>
        <div className="calc" style={{ marginTop:12 }}>
          GL per food = GI × available carbs ÷ 100 × servings<br />
          Meal GL = Σ GL<br />
          Meal GI = Σ (GI × available carbs) ÷ Σ available carbs
        </div>
      </section>

      <section className="m-sect" aria-labelledby="gi-what">
        <h3 id="gi-what" className="p-title">What is glycemic index (GI)?</h3>
        <p><strong>GI</strong> ranks how fast a food’s carbohydrate raises blood glucose compared with pure glucose (GI 100), tested with a fixed amount of available carbs. It describes the food, not the portion.</p>
        <div className="table-wrap" style={{ marginTop:10 }}>
          <table className="table">
            <thead><tr><th scope="col">GI</th><th scope="col">Band</th><th scope="col">What it means</th></tr></thead>
            <tbody>
              <tr><td className="tone-good num" style={{ fontWeight:700 }}>55 or less</td><td>Low</td><td>Slow rise — steadier energy, lower insulin demand</td></tr>
              <tr><td className="tone-warn num" style={{ fontWeight:700 }}>56–69</td><td>Medium</td><td>Moderate rise — watch the portion</td></tr>
              <tr><td className="tone-bad num" style={{ fontWeight:700 }}>70 or more</td><td>High</td><td>Rapid spike → insulin surge → dip → hunger</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section className="m-sect" aria-labelledby="gl-what">
        <h3 id="gl-what" className="p-title">What is glycemic load (GL)?</h3>
        <p><strong>GL</strong> adds portion size: a high-GI food eaten in a small amount can still have a low GL. Fiber is subtracted first because it doesn’t raise blood glucose.</p>
        <div className="calc">GL = GI × (carbs − fiber) ÷ 100</div>
        {example && (
          <p className="num">Example — {example.name}: GI {example.gi}, {fmtNum(example.carbs, 'g')} carbs − {fmtNum(example.fiber, 'g')} fiber = {fmtNum(example.avail, 'g')} available → GL = {example.gi} × {fmtNum(example.avail, '', 1)} ÷ 100 = <strong>{fmtNum(example.gl, '', 1)}</strong> per serving.</p>
        )}
        <div className="table-wrap" style={{ marginTop:10 }}>
          <table className="table">
            <thead><tr><th scope="col">GL</th><th scope="col">Band</th><th scope="col">Interpretation</th></tr></thead>
            <tbody>
              <tr><td className="tone-good num" style={{ fontWeight:700 }}>10 or less</td><td>Low</td><td>Minimal insulin demand</td></tr>
              <tr><td className="tone-warn num" style={{ fontWeight:700 }}>10–20</td><td>Medium</td><td>Moderate — manageable in context</td></tr>
              <tr><td className="tone-bad num" style={{ fontWeight:700 }}>20 or more</td><td>High</td><td>Significant insulin demand</td></tr>
            </tbody>
          </table>
        </div>
        <p>GL bands are defined per serving; a whole meal is held to the same bands, so meal totals read conservatively. GI values come from <code>gi-data.json</code> (published GI research); foods without a direct match use a labeled estimate. <a href="#m-glycemic" onClick={onClose}>Full method ↓</a></p>
      </section>
    </Modal>
  );
}

/* ══════════════════════════════════════════════════════════════════
   FOOD LIST
   ══════════════════════════════════════════════════════════════════ */
function Stepper({ name, qty, max, onSet }) {
  return (
    <div className="stepper" role="group" aria-label={`Servings of ${name}`}>
      <button type="button" aria-label={`Remove a serving of ${name}`} disabled={qty <= 0} onClick={() => onSet(qty - 1)}>−</button>
      <output className="num" aria-label={`${qty} ${qty === 1 ? 'serving' : 'servings'}`}>{qty}</output>
      <button type="button" aria-label={`Add a serving of ${name}`} disabled={qty >= max} onClick={() => onSet(qty + 1)}>+</button>
    </div>
  );
}

function FoodChips({ item }) {
  const g = itemGlycemic(item), band = giBand(g.gi);
  const added = num(item.addedSugar);
  return (
    <span className="chips">
      {band && <Chip tone={band.tone} title={`Glycemic index ${g.gi} — ${band.label.toLowerCase()}`}>GI {g.gi}</Chip>}
      {added >= 4 && <Chip tone={added >= 8 ? 'bad' : 'warn'} title={`${fmtTrim(added)} g added sugar per serving`}>+{fmtTrim(added)} g sugar</Chip>}
      {item.hydrogenatedOil && <Chip tone="bad" title="Contains hydrogenated oil">HYD</Chip>}
      {num(item.processed) >= 3 && <Chip tone="warn" title="Ultra-processed (processing level 3 of 3)">UPF</Chip>}
      {item.animal && <Chip tone="neutral" title="Animal-derived ingredients"><span aria-hidden="true">🐄</span><span className="sr-only">Animal-derived</span></Chip>}
    </span>
  );
}

function Fact({ label, value, sub }) {
  return <div className={`fact${sub ? ' sub' : ''}`}><dt>{label}</dt><dd>{value}</dd></div>;
}

function FoodDetails({ id, item }) {
  const g = itemGlycemic(item);
  const band = giBand(g.gi), lband = g.gl == null ? null : glBand(g.gl);
  const animalG = num(item.protein) * clamp(num(item.animalProtein), 0, 1);
  const parts = servingParts(item);
  return (
    <div id={id} className="details ink">
      {item.note && <p className="note">{item.note}</p>}

      <section aria-label="Energy split per serving">
        <h4 className="d-title">Energy split · per {item.unit}</h4>
        <MacroBar parts={parts} size="md" />
      </section>

      <section aria-label="Nutrition per serving">
        <h4 className="d-title">Nutrition · per {item.unit}</h4>
        <dl className="facts num">
          <Fact label="Calories" value={fmtNum(num(item.cal))} />
          <Fact label="Fat" value={fmtNum(num(item.fat), 'g')} />
          <Fact label="Sat. fat" value={fmtNum(num(item.satFat), 'g')} sub />
          {(num(item.transFat) > 0 || item.transFatRisk) && <Fact label="Trans fat" value={`≈${fmtNum(num(item.transFat), 'g')}`} sub />}
          <Fact label="Carbs" value={fmtNum(num(item.carbs), 'g')} />
          <Fact label="Fiber" value={fmtNum(num(item.fiber), 'g')} sub />
          <Fact label="Sugars" value={fmtNum(num(item.sugar), 'g')} sub />
          <Fact label="Added sugar" value={fmtNum(num(item.addedSugar), 'g')} sub />
          {num(item.refinedCarbs) > 0 && <Fact label="Refined starch" value={fmtNum(parts.refinedStarch, 'g')} sub />}
          <Fact label="Protein" value={fmtNum(num(item.protein), 'g')} />
          {animalG >= EPS && <Fact label="Animal" value={fmtNum(animalG, 'g')} sub />}
          <Fact label="Sodium" value={fmtNum(num(item.sodium), 'mg')} />
          {num(item.caffeine) > 0 && <Fact label="Caffeine" value={fmtNum(num(item.caffeine), 'mg')} />}
        </dl>
      </section>

      <section aria-label="Glycemic index and load">
        <h4 className="d-title">Glycemic impact · per {item.unit}</h4>
        {g.gi != null ? (
          <>
            <div className="gi-line">
              <Chip tone={band.tone}>GI {g.gi} · {band.label}</Chip>
              <Chip tone={lband.tone}>GL {fmtNum(g.gl, '', 1)} · {lband.label}</Chip>
            </div>
            <div className="calc num">GL = {g.gi} × ({fmtTrim(num(item.carbs))} g carbs − {fmtTrim(num(item.fiber))} g fiber) ÷ 100 = {fmtNum(g.gl, '', 1)}</div>
          </>
        ) : (
          <p className="note" style={{ fontSize:14 }}>GI not applicable — too little carbohydrate to raise blood glucose.</p>
        )}
        {(item.giSource || item.giNote) && (
          <p className="src">{item.giSource && <><b>GI source:</b> {item.giSource}. </>}{item.giNote}</p>
        )}
      </section>

      <section aria-label="Processing">
        <h4 className="d-title">Processing</h4>
        <div className="gi-line">
          <Chip tone={num(item.processed) >= 3 ? 'bad' : num(item.processed) >= 2 ? 'warn' : 'good'}>Level {num(item.processed)} of 3</Chip>
          <Chip tone="plain">{fmtNum(clamp(num(item.wholeFood), 0, 1) * 100, '%')} whole food</Chip>
        </div>
        {item.processedReason && <p className="src">{item.processedReason}</p>}
      </section>
    </div>
  );
}

function FoodItem({ item, qty, expanded, onSet, onToggle }) {
  const active = qty > 0;
  const max = num(item.max) > 0 ? item.max : DEFAULT_MAX_QTY;
  const detailsId = `details-${item.id}`;
  return (
    <li className={`food${active ? ' is-active' : ''}`}>
      <div className="food-row">
        <Stepper name={item.name} qty={qty} max={max} onSet={n => onSet(clamp(n, 0, max))} />
        <button type="button" className="food-main" aria-expanded={expanded} aria-controls={detailsId} onClick={onToggle}>
          <span className="food-text">
            <span className="food-name">{item.name}</span>
            <span className="food-sub">{item.brand} · {active ? fmtPortion(qty, item.unit) : item.unit}</span>
            <FoodChips item={item} />
          </span>
          <span className="food-kcal num">
            <b>{fmtNum(num(item.cal) * Math.max(qty, 1))}</b>
            <span>{active ? 'cal total' : 'cal each'}</span>
          </span>
          <Chevron open={expanded} />
        </button>
      </div>
      {expanded && <FoodDetails id={detailsId} item={item} />}
    </li>
  );
}

/* ══════════════════════════════════════════════════════════════════
   SUMMARY SHEET
   ══════════════════════════════════════════════════════════════════ */
function SummarySheet({ meal, count, open, onToggle, onOpenGlycemic }) {
  if (!meal) {
    return (
      <aside className="sheet ink" aria-label="Meal summary">
        <div className="sheet-inner"><p className="sheet-empty">Add foods with <strong>+</strong> to see the meal’s grade, calories and glycemic load.</p></div>
      </aside>
    );
  }
  const { score, glycemic: g } = meal;
  return (
    <aside className={`sheet ink${open ? ' is-open' : ''}`} aria-label="Meal summary">
      <div className="sheet-inner">
        <div className="sheet-head">
          <button type="button" className="sheet-toggle" aria-expanded={open} aria-controls="sheet-body" onClick={onToggle}>
            <span className={`grade grade-${score ? score.grade : 'none'}`} aria-hidden="true">{score ? score.grade : '–'}</span>
            <span className="sum">
              <span className="sum-top">
                {score
                  ? <><span className="nowrap">{score.label}</span> <span className="score num nowrap">· quality {score.value}/100</span></>
                  : 'Not graded — no calories'}
              </span>
              <span className="sum-main num">
                <span><span className="sum-kcal">{fmtNum(meal.kcal)}</span> <span className="sum-unit">cal</span></span>
                <span className="sum-unit">{count} {count === 1 ? 'food' : 'foods'}</span>
              </span>
            </span>
            <span className="sum-cta">{open ? 'Hide details' : 'Details'}<Chevron open={!open} size={16} /></span>
          </button>
          {g.hasRated && (
            <div className="sheet-chips">
              <button type="button" className={`gchip tone-${g.giBand.tone}`} onClick={onOpenGlycemic} aria-label={`Meal glycemic index ${fmtNum(g.gi)}, ${g.giBand.label}. Open glycemic details`}>
                GI {fmtNum(g.gi)} <span className="i">{g.giBand.label}</span>
              </button>
              <button type="button" className={`gchip tone-${g.glBand.tone}`} onClick={onOpenGlycemic} aria-label={`Meal glycemic load ${fmtNum(g.gl, '', 1)}, ${g.glBand.label}. Open glycemic details`}>
                GL {fmtNum(g.gl, '', 1)} <span className="i">{g.glBand.label}</span>
              </button>
            </div>
          )}
        </div>

        {open && (
          <div id="sheet-body" className="sheet-body">
            <div className="col">
              <section aria-labelledby="p-macro">
                <h3 id="p-macro" className="p-title">Macro distribution · share of energy</h3>
                <MacroBar parts={meal.parts} size="lg" />
              </section>
              <section aria-labelledby="p-score">
                <h3 id="p-score" className="p-title">Why this grade</h3>
                {score ? <ScoreBreakdown score={score} /> : <p className="p-note">Zero-calorie selections aren’t graded.</p>}
              </section>
              <section aria-labelledby="p-warn">
                <h3 id="p-warn" className="p-title">Warnings</h3>
                <Warnings flags={meal.flags.list} />
              </section>
            </div>
            <div className="col">
              <section aria-labelledby="p-watch">
                <h3 id="p-watch" className="p-title">Watch these · vs. a full day</h3>
                <div className="metrics">{meal.limits.map(m => <MetricRow key={m.key} m={m} />)}</div>
              </section>
              <section aria-labelledby="p-more">
                <h3 id="p-more" className="p-title">Want more of · vs. a full day</h3>
                <div className="metrics">{meal.targets.map(m => <MetricRow key={m.key} m={m} />)}</div>
              </section>
              {meal.carbCharts && (
                <section aria-labelledby="p-carbs">
                  <h3 id="p-carbs" className="p-title">Carbohydrate breakdown</h3>
                  <CarbCharts charts={meal.carbCharts} totalCarbs={meal.carbCharts[0].total} />
                </section>
              )}
              <p className="p-note">How every number is calculated: <a href="#methodology" onClick={onToggle}>Methodology ↓</a></p>
            </div>
          </div>
        )}
      </div>
    </aside>
  );
}

/* ══════════════════════════════════════════════════════════════════
   METHODOLOGY
   ══════════════════════════════════════════════════════════════════ */
/** Formula list: label on the left, expression on the right (stacks on phones). */
function Formulas({ rows }) {
  return (
    <dl className="formula">
      {rows.map(([lhs, rhs, hint]) => (
        <React.Fragment key={lhs}>
          <dt>{lhs}</dt>
          <dd>= {rhs}{hint && <span className="hint">{'  '}({hint})</span>}</dd>
        </React.Fragment>
      ))}
    </dl>
  );
}

function Methodology({ data, checks }) {
  const daily = data.DAILY || {};
  const refRows = Object.keys(REFERENCE_INFO).filter(k => num(daily[k]) > 0);
  return (
    <section id="methodology" className="method" aria-labelledby="m-title">
      <header>
        <div className="eyebrow">How it works</div>
        <h2 id="m-title">Methodology</h2>
        <p className="lede">Every number on this page is calculated in your browser from <code>data.json</code> using the formulas below. Nothing is sent anywhere; your selections are saved only in this browser.</p>
      </header>

      <h3 id="m-meaning"><span className="n">1</span>What the numbers mean</h3>
      <ul className="bullets">
        <li><strong>Grade and quality score</strong> rate <em>what</em> you eat, per calorie. Doubling every serving leaves the grade unchanged.</li>
        <li><strong>“Watch these” and “Want more of”</strong> measure <em>how much</em>: this meal against a full day’s limit or target.</li>
        <li><strong>Glycemic load (GL)</strong> estimates the meal’s blood-sugar impact; <strong>glycemic index (GI)</strong> is its carb-weighted average speed.</li>
      </ul>

      <h3 id="m-sources"><span className="n">2</span>Data sources</h3>
      <ul className="bullets">
        <li><strong>Nutrition per serving</strong> — product Nutrition Facts labels for packaged foods (brand shown under each name) and USDA FoodData Central for fresh fruit. Values keep label rounding: US labels can list under 0.5 g of fat, trans fat or sugar as 0 g.</li>
        <li><strong>Trans fat</strong> — for products with hydrogenated oils or emulsifiers, a small estimated amount is entered even where the label says 0 g. These are marked “≈”.</li>
        <li><strong>Glycemic index</strong> — matched to <code>gi-data.json</code>, a table of published GI values (glucose = 100). Each food’s detail panel names the matched entry; foods without a close match are labeled as estimates or proxies.</li>
        <li><strong>Editorial fields</strong> — judged from ingredient lists: processing level (0–3), whole-food fraction (0–1), share of protein from animal sources (0–1), and the hydrogenated-oil, trans-fat-risk and animal-derived flags.</li>
      </ul>

      <h3 id="m-refs"><span className="n">3</span>Daily reference values</h3>
      <p>Read from the <code>DAILY</code> block of <code>data.json</code>. Each bar compares this meal with a <strong>full day</strong>, so a single meal using a third of a limit is on pace.</p>
      <div className="table-wrap">
        <table className="ptable responsive">
          <thead><tr><th scope="col">Nutrient</th><th scope="col" className="n">Value</th><th scope="col">Type</th><th scope="col">Basis</th></tr></thead>
          <tbody>
            {refRows.map(k => {
              const r = REFERENCE_INFO[k];
              return (
                <tr key={k}>
                  <td><strong>{r.label}</strong></td>
                  <td className="n" data-label="Value">{fmtNum(num(daily[k]), r.unit)}</td>
                  <td data-label="Type">{r.kind === 'limit' ? 'Limit' : 'Target'}</td>
                  <td data-label="Basis">{r.basis}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <h3 id="m-calc"><span className="n">4</span>Core calculations</h3>
      <Formulas rows={[
        ['Meal total', 'Σ (amount per serving × servings)'],
        ['Starch', 'carbs − sugars − fiber'],
        ['Refined starch', 'min(refined carbs, starch)'],
        ['Whole starch', 'starch − refined starch'],
        ['Natural sugar', 'sugars − added sugar'],
        ['Unsaturated fat', 'fat − saturated fat − trans fat'],
        ['Animal protein', 'protein × animal-protein fraction'],
        ['Plant protein', 'protein − animal protein'],
        ['Energy (macro bar)', '2 cal/g fiber + 4 cal/g other carbs + 4 cal/g protein + 9 cal/g fat'],
        ['Whole-food %', 'Σ (cal × whole-food fraction) ÷ Σ cal'],
        ['Density', 'grams ÷ meal calories × 100', 'g per 100 cal'],
      ]} />
      <p>Each split is computed per food and then summed, and every part is clamped at zero, so label rounding can never produce negative grams. The macro bar shows shares of macro-derived energy (Atwater factors); these can differ by a few percent from label calories. Displayed percentages use largest-remainder rounding so each bar totals exactly 100%.</p>

      <h3 id="m-glycemic"><span className="n">5</span>Glycemic index and load</h3>
      <Formulas rows={[
        ['Available carbs', 'total carbs − fiber'],
        ['GL (per food)', 'GI × available carbs ÷ 100 × servings'],
        ['Meal GL', 'Σ GL'],
        ['Meal GI', 'Σ (GI × available carbs) ÷ Σ available carbs', 'foods with a GI only'],
      ]} />
      <ul className="bullets" style={{ marginTop:10 }}>
        <li><strong>Available carbs</strong> are used because published GI tests and GL tables are based on them; using total carbs would overstate GL for high-fiber foods such as oats.</li>
        <li><strong>Meal GI</strong> is the carbohydrate-weighted average — the standard mixed-meal method. Foods whose GI is “not applicable” (about 1 g of carbs or less, e.g. cheese, plain tea) are left out of the average and shown as n/a; their carbs are reported separately.</li>
        <li><strong>Bands:</strong> GI low ≤ 55, medium 56–69, high ≥ 70. GL low ≤ 10, medium 10–20, high ≥ 20. Bands are judged on the rounded value shown. GL bands are defined per serving; a whole meal is held to the same bands, so meal totals read conservatively.</li>
        <li><strong>Limits:</strong> fat, protein and acidity in a meal lower the real glycemic response, and ripeness, cooking and the individual all shift GI. Treat meal GI and GL as estimates.</li>
      </ul>

      <h3 id="m-score"><span className="n">6</span>Quality score and grade</h3>
      <p>Starts at <strong>{SCORE_BASE}</strong>. Each rule that applies adds or subtracts points; the total is rounded and kept within 0–100. Density rules use grams per 100 cal, so the score reflects food quality rather than portion size. Trans-fat risk and hydrogenated oil are all-or-nothing: any amount triggers them. The highest reachable score is <strong>{SCORE_MAX_REACHABLE}</strong>. Zero-calorie selections are not graded.</p>
      <div className="table-wrap">
        <table className="ptable responsive">
          <thead><tr><th scope="col">Factor</th><th scope="col">Applies when</th><th scope="col" className="n">Points</th></tr></thead>
          <tbody>{SCORE_RULES.map(r => (
            <tr key={r.id}><td><strong>{r.label}</strong></td><td data-label="When">{r.when}</td><td className="n" data-label="Points">{r.effect}</td></tr>
          ))}</tbody>
        </table>
      </div>
      <div className="table-wrap">
        <table className="ptable">
          <thead><tr><th scope="col">Grade</th><th scope="col">Score</th><th scope="col">Label</th></tr></thead>
          <tbody>{GRADES.map((g, i) => {
            const hi = i === 0 ? 100 : GRADES[i - 1].min - 1;
            const lo = Number.isFinite(g.min) ? g.min : 0;
            return <tr key={g.grade}><td><strong>{g.grade}</strong></td><td className="num">{lo}–{hi}</td><td>{g.label}</td></tr>;
          })}</tbody>
        </table>
      </div>

      <h3 id="m-warn"><span className="n">7</span>Warnings</h3>
      <dl>
        <div><dt>Hydrogenated oils</dt><dd>Any selected food flagged as containing hydrogenated oil.</dd></div>
        <div><dt>Trans-fat risk</dt><dd>Any food flagged for trans-fat risk or with an estimated trans fat above 0 g.</dd></div>
        <div><dt>Ultra-processed</dt><dd>Shown when any food is at processing level 3; lists every food at level 2–3, most severe first.</dd></div>
        <div><dt>Animal-derived</dt><dd>Any food flagged as containing dairy or other animal-derived ingredients (including milk derivatives such as caseinate).</dd></div>
      </dl>

      <h3 id="m-bars"><span className="n">8</span>“Watch these” and “Want more of”</h3>
      <ul className="bullets">
        <li>Each bar is <strong>meal amount ÷ daily reference</strong>. Limit bars are green up to 50%, amber to 75% and red above; past 100% the bar stays full and the line reads “Over …” in red.</li>
        <li>Refined starch, saturated fat, trans fat and added sugar use the same clamped parts as the macro bar, so every display agrees.</li>
        <li>The protein bar is split into plant and animal shares; whole food is the calorie-weighted share described in section 4.</li>
        <li>Short descriptions such as “Moderate” or “LDL increasing” are fixed gram thresholds — rules of thumb, not diagnoses.</li>
      </ul>

      <h3 id="m-carbs"><span className="n">9</span>Carbohydrate charts</h3>
      <ul className="bullets">
        <li><strong>Whole-food vs processed</strong> (by carb type): whole-food = whole starch + fiber + natural sugar; processed = refined starch + added sugar.</li>
        <li><strong>Slow vs fast</strong> (by carb type): slow = whole starch + fiber; fast = natural sugar + refined starch + added sugar. Sugar in whole fruit counts as fast by type even though intact fiber slows it — the GI shows the actual effect.</li>
        <li><strong>By food group</strong>: each food’s total carbs are assigned to its menu section (Base, Fruit, …).</li>
        <li>All three split total carbohydrate grams, fiber included.</li>
      </ul>

      <h3 id="m-key"><span className="n">10</span>Food-row indicators</h3>
      <ul className="bullets">
        <li><Chip tone="good">GI</Chip> chip — the food’s glycemic index, colored by band (green low, amber medium, red high).</li>
        <li><Chip tone="warn">+N g sugar</Chip> — added sugar per serving: amber from 4 g, red from 8 g.</li>
        <li><Chip tone="bad">HYD</Chip> hydrogenated oil · <Chip tone="warn">UPF</Chip> processing level 3 · <Chip tone="neutral">🐄</Chip> animal-derived.</li>
      </ul>

      <h3 id="m-checks"><span className="n">11</span>Data checks</h3>
      <p>Run on <code>data.json</code> every time the page loads ({checks.foods} foods). {checks.failed === 0 ? 'All checks pass.' : `${checks.failed} check${checks.failed === 1 ? '' : 's'} failing — see below and the browser console.`}</p>
      <ul className="checks">
        {checks.results.map(r => (
          <li key={r.id}>
            <span className={`mark ${r.failures.length ? 'tone-bad' : 'tone-good'}`} aria-hidden="true">{r.failures.length ? '✗' : '✓'}</span>
            <span>{r.label}<span className="sr-only">{r.failures.length ? ': failing' : ': passing'}</span>
              {r.failures.length > 0 && <span className="fail-list">{r.failures.join(', ')}</span>}
            </span>
          </li>
        ))}
      </ul>

      <h3 id="m-limits"><span className="n">12</span>Limitations</h3>
      <ul className="bullets">
        <li>An educational tool, not medical or dietary advice.</li>
        <li>Reference values are general adult guidance. Needs differ: the AHA added-sugar limit for women is 25 g, and the protein target assumes an 80 kg (177 lb) adult.</li>
        <li>Brand formulations change; check current labels.</li>
        <li>Processing level, whole-food fraction and animal-protein share are informed judgments, not lab measurements.</li>
      </ul>

      <h3 id="m-cite"><span className="n">13</span>References</h3>
      <ul className="refs">
        <li>Atkinson FS, Foster-Powell K, Brand-Miller JC. International tables of glycemic index and glycemic load values: 2008. <em>Diabetes Care</em> 2008;31:2281–3.</li>
        <li>Wolever TMS, Jenkins DJA. The use of the glycemic index in predicting the blood glucose response to mixed meals. <em>Am J Clin Nutr</em> 1986;43:167–72.</li>
        <li>Johnson RK, et al. Dietary sugars intake and cardiovascular health: a scientific statement from the American Heart Association. <em>Circulation</em> 2009;120:1011–20.</li>
        <li>World Health Organization. Saturated fatty acid and trans-fatty acid intake for adults and children: WHO guideline. 2023.</li>
        <li>U.S. Food and Drug Administration. Daily Value on the Nutrition and Supplement Facts labels; Spilling the beans: how much caffeine is too much?</li>
        <li>USDA FoodData Central (fresh fruit values).</li>
      </ul>

      <p className="colophon">Food as Medicine · methodology revised October 2026 · {checks.foods} foods in <code>data.json</code></p>
    </section>
  );
}

/* ══════════════════════════════════════════════════════════════════
   APP
   ══════════════════════════════════════════════════════════════════ */
function buildIndex(data) {
  const index = new Map();
  data.CATEGORIES.forEach((c, ci) => c.items.forEach(item => index.set(item.id, { item, category:{ name:c.name, icon:c.icon, index:ci } })));
  return index;
}

function App() {
  const saved = useRef(loadState()).current;      // read once, not on every render
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [qty, setQty] = useState(() => (saved && saved.q) || {});
  const [open, setOpen] = useState(() => !!(saved && saved.p));
  const [expanded, setExpanded] = useState(null);
  const [giOpen, setGiOpen] = useState(false);

  useEffect(() => {
    fetch(DATA_URL, { cache:'no-cache' })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(d => {
        if (!d || !Array.isArray(d.CATEGORIES)) throw new Error('unexpected file format');
        setData(d);
      })
      .catch(e => setError(e.message));
  }, []);

  const index = useMemo(() => (data ? buildIndex(data) : null), [data]);
  const checks = useMemo(() => (data ? runDataChecks(data) : null), [data]);

  // Once data arrives: drop saved ids that no longer exist, restore scroll, report data problems.
  const restored = useRef(false);
  useEffect(() => {
    if (!index || restored.current) return;
    restored.current = true;
    setQty(q => sanitizeQuantities(q, index));
    if (saved && saved.y > 0) window.scrollTo({ top:saved.y, behavior:'instant' });
    checks.results.filter(r => r.failures.length).forEach(r => console.warn(`[data.json] ${r.label}: ${r.failures.join(', ')}`));
  }, [index]);

  // Persist selections, panel state and scroll position (debounced).
  const latest = useRef({ q:qty, p:open });
  latest.current = { q:qty, p:open };
  const saveSoon = useRef(null);
  useEffect(() => {
    let t;
    saveSoon.current = () => { clearTimeout(t); t = setTimeout(() => saveState({ ...latest.current, y:window.scrollY }), 250); };
    window.addEventListener('scroll', saveSoon.current, { passive:true });
    return () => { window.removeEventListener('scroll', saveSoon.current); clearTimeout(t); };
  }, []);
  useEffect(() => { if (restored.current && saveSoon.current) saveSoon.current(); }, [qty, open]);

  const lines = useMemo(() => (index
    ? Object.entries(qty).filter(([id, n]) => index.has(id) && n > 0).map(([id, n]) => ({ ...index.get(id), qty:n }))
    : []), [index, qty]);
  const meal = useMemo(() => (lines.length ? computeMeal(lines, data.DAILY || {}) : null), [lines, data]);
  const example = useMemo(() => {
    if (!index) return null;
    const pick = index.get('quaker_oats') || [...index.values()].find(v => itemGlycemic(v.item).gi != null && num(v.item.fiber) > 0);
    if (!pick) return null;
    const g = itemGlycemic(pick.item);
    return g.gi == null ? null : { name:pick.item.name, gi:g.gi, carbs:num(pick.item.carbs), fiber:num(pick.item.fiber), avail:g.avail, gl:g.gl };
  }, [index]);

  if (error) {
    return (
      <p className="status is-error" role="alert">
        Couldn’t load <strong>data.json</strong> ({error}).<br />If you opened this file directly, serve the folder instead:<br />
        <code>python3 -m http.server 8000</code>
      </p>
    );
  }
  if (!data) return <p className="status" role="status">Loading…</p>;

  const setFoodQty = (id, n) => setQty(prev => { const next = { ...prev }; if (n <= 0) delete next[id]; else next[id] = n; return next; });
  const clearAll = () => { setQty({}); setOpen(false); setExpanded(null); window.scrollTo({ top:0, behavior:'smooth' }); };
  const count = lines.length;

  return (
    <>
      <main className="app">
        <header className="hero">
          <div className="eyebrow">Food as Medicine</div>
          <h1>Build Your Meal</h1>
          <p className="lede">Add servings with + and −. The grade rates food quality per calorie, not portion size; the bars compare this meal with a full day’s limits.</p>
          <div className="hero-actions">
            <button type="button" className="btn" onClick={clearAll} disabled={count === 0}>Clear all</button>
            <span className="count" aria-live="polite">{count === 0 ? 'No foods selected' : `${count} ${count === 1 ? 'food' : 'foods'} selected`}</span>
            <a className="text-link" href="#methodology">How it’s calculated ↓</a>
          </div>
          <div className="key" aria-label="Key to food-row indicators">
            <div className="key-title">Key</div>
            <ul className="key-list">
              <li><Chip tone="good">GI 50</Chip><Chip tone="warn">GI 60</Chip><Chip tone="bad">GI 75</Chip> glycemic index</li>
              <li><Chip tone="warn">+5 g sugar</Chip> added sugar per serving</li>
              <li><Chip tone="bad">HYD</Chip> hydrogenated oil</li>
              <li><Chip tone="warn">UPF</Chip> ultra-processed</li>
              <li><Chip tone="neutral">🐄</Chip> animal-derived</li>
            </ul>
          </div>
        </header>

        <div className="grid">
          {data.CATEGORIES.map((cat, ci) => (
            <section key={ci} aria-labelledby={`cat-${ci}`}>
              <div className="cat-head">
                <span className="cat-icon" aria-hidden="true">{cat.icon}</span>
                <div><h2 id={`cat-${ci}`} className="cat-name">{cat.name}</h2><p className="cat-desc">{cat.desc}</p></div>
              </div>
              <ul className="foods">
                {cat.items.map(item => (
                  <FoodItem key={item.id} item={item} qty={qty[item.id] || 0} expanded={expanded === item.id}
                    onSet={n => setFoodQty(item.id, n)} onToggle={() => setExpanded(expanded === item.id ? null : item.id)} />
                ))}
              </ul>
            </section>
          ))}
        </div>

        <Methodology data={data} checks={checks} />
      </main>

      <SummarySheet meal={meal} count={count} open={open} onToggle={() => setOpen(o => !o)} onOpenGlycemic={() => setGiOpen(true)} />
      {giOpen && meal && <GlycemicModal glycemic={meal.glycemic} example={example} onClose={() => setGiOpen(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
