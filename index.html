<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<meta name="description" content="Build a meal from everyday foods and see its quality grade, glycemic load and how it compares with daily limits."/>
<title>Food as Medicine — Meal Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════════════════════
   DESIGN TOKENS
   Paper = the page (light, or dark in dark mode).
   Ink   = data surfaces (summary sheet, food details, modal) — dark in both themes.
   All text tokens meet WCAG AA (≥ 4.5:1) on the surfaces they are used on.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --font-sans:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --radius-sm:6px; --radius:10px; --radius-lg:16px;

  /* paper — light */
  --bg:#f7f5f2; --surface:#ffffff; --surface-2:#efebe5; --surface-3:#e4dfd7;
  --text:#1e1e1e; --text-2:#4f4b45; --text-3:#6b665f; --border:#e3ddd4;
  --focus:#2f6fde; --info:#2f5fb3;
  --good:#1f7a47; --warn:#8f5b0a; --bad:#b42318; --neutral:#6b665f;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.04);
  --row-active-bg:#1e1e1e; --row-active-text:#f4f4f4; --row-active-text-2:#b9b9b9;
  --row-active-control:#333; --row-active-control-hover:#454545; --row-active-accent:transparent;

  /* ink — data surfaces */
  --ink-bg:#151515; --ink-surface:#1e1e1e; --ink-surface-2:#262626; --ink-track:#2e2e2e;
  --ink-text:#efefef; --ink-text-2:#bdbdbd; --ink-text-3:#9a9a9a; --ink-border:#333;
  --ink-good:#5cc98d; --ink-warn:#e6ad4e; --ink-bad:#f2766b; --ink-neutral:#bdbdbd; --ink-info:#8ab4ff;

  /* macro family colors (legend group headings on ink) */
  --g-carb:#86aef0; --g-fat:#e3c55c; --g-prot:#f08080;

  /* grade badges (white text ≥ 4.7:1) */
  --grade-A:#1e7b4a; --grade-B:#3f7d55; --grade-C:#9a6a12; --grade-D:#b4531a; --grade-F:#b42318;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121212; --surface:#1b1b1b; --surface-2:#272727; --surface-3:#323232;
    --text:#ededed; --text-2:#c4beb6; --text-3:#a29c94; --border:#2d2d2d;
    --focus:#7aa7ff; --info:#8ab4ff;
    --good:#5cc98d; --warn:#e6ad4e; --bad:#f2766b; --neutral:#a29c94;
    --shadow:none;
    --row-active-bg:#2b2622; --row-active-text:#f6f6f6; --row-active-text-2:#cfc8bf;
    --row-active-control:#3c3631; --row-active-control-hover:#4a433d; --row-active-accent:#d9a441;
    --ink-bg:#0e0e0e; --ink-surface:#191919; --ink-surface-2:#222; --ink-track:#2a2a2a; --ink-border:#2e2e2e;
  }
}

/* ══ BASE ══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tone-good{color:var(--good)} .tone-warn{color:var(--warn)} .tone-bad{color:var(--bad)} .tone-neutral{color:var(--text-2)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}

/* ink scope: shared components read --text*, --good… so they work on both surfaces */
.ink{
  --text:var(--ink-text); --text-2:var(--ink-text-2); --text-3:var(--ink-text-3); --border:var(--ink-border);
  --good:var(--ink-good); --warn:var(--ink-warn); --bad:var(--ink-bad); --neutral:var(--ink-neutral); --info:var(--ink-info);
  --surface:var(--ink-surface); --surface-2:var(--ink-surface-2);
  color:var(--text);
}

/* ══ STATUS / LOADING ══════════════════════════════════════════════ */
.status{max-width:560px;margin:80px auto;padding:0 16px;text-align:center;font-size:16px;color:var(--text-2)}
.status.is-error{color:var(--bad)}
.status code{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-family:var(--font-mono);font-size:14px}

/* ══ LAYOUT ════════════════════════════════════════════════════════ */
.app{max-width:1120px;margin:0 auto;padding:32px 16px 200px}
.hero{margin-bottom:32px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:700}
.hero h1{font-family:var(--font-display);font-size:clamp(30px,6vw,42px);line-height:1.08;font-weight:700;margin:8px 0 10px;letter-spacing:-.01em}
.lede{font-size:17px;line-height:1.55;color:var(--text-2);max-width:64ch}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;background:var(--surface-2);color:var(--text)}
.btn:hover:not(:disabled){background:var(--surface-3)}
.btn:disabled{opacity:.45}
.count{font-size:15px;color:var(--text-2)}
.text-link{font-size:15px;font-weight:600;color:var(--info);text-decoration:underline;text-underline-offset:3px}

.key{margin-top:20px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:14px;color:var(--text-2)}
.key-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--text-3);margin-bottom:8px}
.key-list{display:flex;flex-wrap:wrap;gap:8px 18px}
.key-list li{display:inline-flex;align-items:center;gap:6px}

/* ══ CATEGORIES & FOOD ROWS ════════════════════════════════════════ */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
@media (min-width:780px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px 28px}}
.cat-head{display:flex;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.cat-icon{font-size:26px;line-height:1}
.cat-name{font-size:19px;font-weight:700;line-height:1.2}
.cat-desc{font-size:14px;color:var(--text-3)}
.foods{display:flex;flex-direction:column;gap:8px}

.food{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:background-color .15s,border-color .15s}
.food.is-active{
  background:var(--row-active-bg);border-color:var(--row-active-bg);color:var(--row-active-text);box-shadow:inset 3px 0 0 var(--row-active-accent);
  --text:var(--row-active-text); --text-2:var(--row-active-text-2); --text-3:var(--row-active-text-2);
  --good:var(--ink-good); --warn:var(--ink-warn); --bad:var(--ink-bad); --neutral:var(--ink-neutral);
}
.food-row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px}
.food-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 4px 4px 2px;border-radius:8px}
.food-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.food-name{font-size:16px;font-weight:600;line-height:1.3}
.food-sub{font-size:13.5px;line-height:1.35;color:var(--text-3)}
.food-kcal{flex-shrink:0;text-align:right;min-width:52px;line-height:1.15}
.food-kcal b{display:block;font-size:19px;font-weight:800}
.food-kcal span{font-size:12px;color:var(--text-3)}
.chev{flex-shrink:0;color:var(--text-3);transition:transform .2s}
.chev.is-open{transform:rotate(180deg)}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;line-height:1.5;padding:0 7px;border-radius:5px;white-space:nowrap;color:var(--neutral);background:color-mix(in srgb,var(--neutral) 13%,transparent)}
.chip-good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.chip-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.chip-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.chip-plain{color:var(--text-2);background:var(--surface-2)}

/* stepper */
.stepper{display:flex;align-items:center;flex-shrink:0;padding:2px;border-radius:999px;background:var(--surface-2)}
.food.is-active .stepper{background:var(--row-active-control)}
.stepper button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:600;line-height:1;color:var(--text-2)}
.stepper button:hover:not(:disabled){background:var(--surface-3)}
.food.is-active .stepper button:hover:not(:disabled){background:var(--row-active-control-hover)}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:22px;text-align:center;font-size:17px;font-weight:800}
@media (max-width:420px){
  .food-row{gap:6px;padding:6px}
  .food-main{gap:6px}
  .stepper button{width:36px;height:36px}
  .stepper output{min-width:18px}
  .food-kcal{min-width:44px}
}

/* food details (ink) */
.details{background:var(--ink-surface);border-top:1px solid var(--ink-border);padding:16px 14px 18px;display:grid;gap:16px;font-size:14px}
.food.is-active .details{background:#262320}
@media (prefers-color-scheme:light){.food.is-active .details{background:#262626}}
.note{font-size:15px;line-height:1.55;color:var(--text)}
.d-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--text-3);margin-bottom:8px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
@media (min-width:480px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fact{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)}
.fact dt{color:var(--text-2)}
.fact dd{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fact.sub dt{padding-left:10px}
.gi-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.calc{font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--text);background:var(--ink-bg);border-radius:var(--radius-sm);padding:8px 10px;overflow-x:auto}
.src{font-size:13px;color:var(--text-3);margin-top:6px;line-height:1.45}
.src b{color:var(--text-2);font-weight:600}

/* ══ STACKED BARS & LEGENDS ═══════════════════════════════════════ */
.stack{display:flex;width:100%;overflow:hidden;border-radius:6px;background:#0b0b0b}
.stack-lg{height:30px} .stack-md{height:20px} .stack-sm{height:16px}
.seg{flex:1 1 0;min-width:0;height:100%;cursor:crosshair}
.seg.grp-start{margin-left:2px}
.sw{display:inline-block;flex-shrink:0;width:20px;height:13px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}

/* segment fills: base color = macro family, overlay texture = sub-type.
   Identical CSS feeds bars and legend swatches, so they always match. */
.t-fiber{background:radial-gradient(circle,rgba(165,198,248,.9) 1.4px,transparent 2px) 0 0/7px 7px,#22458f}
.t-wholeStarch{background:#3a6bc4}
.t-natSugar{background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(6,50,74,.6) 3px 5px),#3a9bc4}
.t-refinedStarch{background:repeating-linear-gradient(135deg,rgba(22,50,125,.8) 0 2px,transparent 2px 6px),#6d98dd}
.t-addedSugar{background:repeating-linear-gradient(45deg,rgba(175,188,255,.55) 0 1.5px,transparent 1.5px 6px),repeating-linear-gradient(-45deg,rgba(175,188,255,.55) 0 1.5px,transparent 1.5px 6px),#2a3a8a}
.t-unsatFat{background:#c4a83a}
.t-satFat{background:repeating-linear-gradient(45deg,rgba(78,48,0,.65) 0 2px,transparent 2px 6px),#a47820}
.t-transFat{background:linear-gradient(135deg,#d0822a 25%,transparent 25%) -4px 0/8px 8px,linear-gradient(225deg,#d0822a 25%,transparent 25%) -4px 0/8px 8px,linear-gradient(315deg,#d0822a 25%,transparent 25%) 0 0/8px 8px,linear-gradient(45deg,#d0822a 25%,transparent 25%) 0 0/8px 8px,#7a3300}
.t-plantProtein{background:#c43a3a}
.t-animalProtein{background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(35,0,0,.65) 3px 5px),#8a2020}
.cat-0{background:#4f7fd8} .cat-1{background:#3fa57a} .cat-2{background:#c99a3c} .cat-3{background:#9c7a5c} .cat-4{background:#a866cf} .cat-5{background:#5aa5b5}
.fill-good{background:var(--good)} .fill-warn{background:var(--warn)} .fill-bad{background:var(--bad)} .fill-whole{background:var(--good)}

.legend{display:grid;gap:8px;margin-top:10px}
.legend-row{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.legend-group{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;min-width:68px;padding-top:2px;line-height:1.3}
.legend-group small{display:block;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--text-3)}
.lg-carb{color:var(--g-carb)} .lg-fat{color:var(--g-fat)} .lg-prot{color:var(--g-prot)}
.legend-items{display:flex;flex-wrap:wrap;gap:6px 14px}
.legend-items li{display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:1.4}
.legend-items .v{font-weight:700;font-variant-numeric:tabular-nums}
.legend-items .p{color:var(--text-3);font-variant-numeric:tabular-nums}

/* tooltip (portalled to <body> so blur/transform ancestors can't offset it) */
.tip{position:fixed;z-index:400;transform:translate(-50%,calc(-100% - 10px));pointer-events:none;max-width:min(320px,92vw);padding:6px 10px;border-radius:6px;background:#0b0b0b;border:1px solid #444;color:#f2f2f2;font-size:13px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.35)}

/* ══ SUMMARY SHEET (ink) ═══════════════════════════════════════════ */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--ink-bg) 97%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--ink-border);box-shadow:0 -8px 28px rgba(0,0,0,.22);overflow-y:auto;overscroll-behavior:contain;max-height:85vh;max-height:85dvh}
.sheet-inner{max-width:1120px;margin:0 auto;padding:0 16px}
.sheet-empty{padding:18px 0;text-align:center;font-size:15px;color:var(--text-2)}
.sheet-head{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 0;background:var(--ink-bg)}
.sheet.is-open .sheet-head{border-bottom:1px solid var(--ink-border)}
.sheet-toggle{flex:1 1 280px;min-width:0;display:flex;align-items:center;gap:14px;border-radius:12px;padding:2px}
.grade{flex-shrink:0;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:28px;font-weight:900;line-height:1;color:#fff}
.grade-A{background:var(--grade-A)} .grade-B{background:var(--grade-B)} .grade-C{background:var(--grade-C)} .grade-D{background:var(--grade-D)} .grade-F{background:var(--grade-F)} .grade-none{background:var(--ink-surface-2);color:var(--text-2)}
.sum{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sum-top{font-size:15px;font-weight:700;line-height:1.3}
.sum-top .score{color:var(--text-2);font-weight:600}
.sum-main{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.sum-kcal{font-size:30px;font-weight:900;line-height:1.05}
.sum-unit{font-size:14px;color:var(--text-2)}
.sum-cta{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--text-2);padding:8px 12px;border-radius:999px;background:var(--ink-surface-2)}
.sheet-toggle:hover .sum-cta{color:var(--text)}
.sheet-chips{display:flex;flex-wrap:wrap;gap:8px}
.gchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,transparent)}
.gchip .i{font-weight:600;opacity:.85}
.sheet-body{display:grid;gap:24px;padding:18px 0 28px}
@media (min-width:920px){.sheet-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start}}
.col{display:grid;gap:24px;min-width:0}
.p-title{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text-3);margin-bottom:12px}
.p-note{font-size:13.5px;color:var(--text-3);margin-top:8px;line-height:1.45}

/* score breakdown */
.score-table{width:100%;border-collapse:collapse;font-size:14.5px}
.score-table th,.score-table td{padding:7px 0;border-bottom:1px solid var(--border);vertical-align:top;text-align:left;font-weight:400}
.score-table td{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.score-table .why{display:block;font-size:13px;color:var(--text-3);margin-top:1px}
.score-table .pos{color:var(--good)} .score-table .neg{color:var(--bad)}
.score-table tr.total th,.score-table tr.total td{border-bottom:0;padding-top:10px;font-size:16px;font-weight:800}

/* warnings */
.flags{display:grid;gap:8px}
.flag{border-radius:var(--radius-sm);background:color-mix(in srgb,var(--tone) 11%,transparent);border-left:3px solid var(--tone)}
.flag-bad{--tone:var(--bad)} .flag-warn{--tone:var(--warn)} .flag-neutral{--tone:var(--neutral)}
.flag-btn{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:15px;font-weight:700;color:var(--tone)}
.flag-count{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--text-2)}
.flag-body{padding:0 12px 12px}
.flag-body > p{font-size:14px;color:var(--text-2);margin-bottom:8px;line-height:1.5}
.flag-items li{padding:8px 0;border-top:1px solid var(--border)}
.flag-items .fi-name{font-size:15px;font-weight:700}
.flag-items .fi-qty{font-weight:500;color:var(--text-3)}
.flag-items .fi-reason{font-size:13.5px;color:var(--text-2);line-height:1.45;margin-top:2px}
.flag-items .fi-meta{font-size:13px;color:var(--text-3);margin-top:2px}
.ok-line{font-size:14.5px;color:var(--good)}

/* metric rows */
.metrics{display:grid;gap:14px}
.metric-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.metric-label{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.metric-value{font-size:15px;white-space:nowrap}
.metric-value b{font-weight:800}
.metric-ref{color:var(--text-3)}
.meter{display:flex;height:8px;border-radius:999px;background:var(--ink-track);overflow:hidden}
.meter-fill{height:100%;transition:width .3s}
.metric-foot{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:13.5px;line-height:1.35}
.metric-foot .of{color:var(--text-3);text-align:right;white-space:nowrap}
.metric-foot .of.is-over{color:var(--bad);font-weight:700}
.metric-detail{font-size:13px;color:var(--text-3);margin-top:2px}

/* carb charts */
.cchart + .cchart{margin-top:18px}
.cchart-title{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;margin-bottom:6px}
.cchart-title h4{font-size:15px;font-weight:700}
.cchart-title span{font-size:13px;color:var(--text-3)}
.cgroups{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:14px;font-weight:700}

/* ══ MODAL (ink) ═══════════════════════════════════════════════════ */
.modal-backdrop{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.62)}
@media (min-width:640px){.modal-backdrop{align-items:center;padding:24px}}
.modal{width:100%;max-width:720px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--ink-surface);border:1px solid var(--ink-border);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
@media (min-width:640px){.modal{border-radius:var(--radius-lg)}}
.modal-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--ink-surface);border-bottom:1px solid var(--ink-border)}
.modal-head h2{font-size:18px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--text-2);background:var(--ink-surface-2)}

.m-sect{padding:18px;border-bottom:1px solid var(--ink-border)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--ink-bg);border-radius:var(--radius);padding:10px 12px}

.stat-value{font-size:28px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-band{font-size:13.5px;font-weight:700}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table{width:100%;border-collapse:collapse;font-size:14.5px}
.table th,.table td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border)}
.table thead th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--text-3);white-space:nowrap}
.table .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.table .sub{display:block;font-size:12.5px;color:var(--text-3);margin-top:2px}
.table tfoot td,.table tfoot th{font-weight:800;border-bottom:0;border-top:2px solid var(--border)}
.table caption{caption-side:bottom;text-align:left;font-size:13px;color:var(--text-3);padding-top:8px;line-height:1.45}

/* ══ METHODOLOGY (paper) ═══════════════════════════════════════════ */
.method{margin-top:64px;padding-top:28px;border-top:2px solid var(--text);scroll-margin-top:16px}
.method > header{margin-bottom:8px}
.method h2{font-family:var(--font-display);font-size:clamp(26px,4.5vw,34px);line-height:1.15}

.method h3{font-size:19px;font-weight:700;margin:32px 0 10px;scroll-margin-top:16px}
.method h3 .n{display:inline-block;min-width:26px;color:var(--text-3)}
.method p,.method li,.method dd{font-size:15.5px;line-height:1.65;color:var(--text-2);max-width:76ch}
.method p + p,.method p + ul,.method ul + p,.method .formula + p,.method p + .formula,.method .table-wrap + p{margin-top:10px}
.method ul.bullets{list-style:disc;padding-left:22px}
.method ul.bullets li + li{margin-top:4px}
.method strong{color:var(--text)}
.method code{font-family:var(--font-mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--text)}
.method dl{display:grid;gap:10px;max-width:80ch}
.method dt{font-weight:700;color:var(--text);font-size:15.5px}
.method .formula{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-family:var(--font-mono);font-size:13.5px;line-height:1.6;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;max-width:100%}
.method .formula dt{color:var(--text-2);font-weight:400;font-size:13.5px}
.method .formula dd{color:var(--text);font-size:13.5px;line-height:1.6;max-width:none;overflow-wrap:anywhere}
.method .formula .hint{color:var(--text-3)}
@media (max-width:560px){
  .method .formula{grid-template-columns:minmax(0,1fr);gap:0}
  .method .formula dd{padding:0 0 8px 12px}
  .method .formula dd:last-child{padding-bottom:0}
  /* reference & scoring tables become stacked cards on phones */
  .ptable.responsive thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .ptable.responsive,.ptable.responsive tbody,.ptable.responsive tr,.ptable.responsive td{display:block;width:100%}
  .ptable.responsive tr{padding:10px 12px;border-bottom:1px solid var(--border)}
  .ptable.responsive tr:last-child{border-bottom:0}
  .ptable.responsive td{padding:2px 0;border:0;text-align:left}
  .ptable.responsive td.n{text-align:left;white-space:normal}
  .ptable.responsive td[data-label]::before{content:attr(data-label) ' · ';color:var(--text-3);font-size:13px;font-weight:600}
  .ptable.responsive td:first-child{font-size:16px}
}
.ptable{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
.ptable th,.ptable td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border);color:var(--text-2)}
.ptable thead th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--text-3);white-space:nowrap;background:var(--surface-2)}
.ptable td.n,.ptable th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptable td strong{color:var(--text)}
.ptable tr:last-child td{border-bottom:0}
.method .table-wrap{margin-top:10px;max-width:100%}
.checks li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);font-size:15px}
.checks .mark{font-weight:900;width:18px;flex-shrink:0}
.checks .fail-list{display:block;font-size:14px;color:var(--bad)}
.refs li{font-size:14px;line-height:1.55;color:var(--text-2)}
.refs li + li{margin-top:6px}
.colophon{margin-top:36px;padding-top:14px;border-top:1px solid var(--border);font-size:14px;color:var(--text-3)}
</style>
</head>
<body>
<div id="root"><p class="status" role="status">Loading…</p></div>
<noscript><p class="status">This meal builder needs JavaScript enabled.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* @calc:start ════════════════════════════════════════════════════════
   CALCULATION LAYER — pure functions, no React or DOM.
   Every number on screen comes from here; the Methodology section at
   the bottom of the page documents each formula and threshold.
   ══════════════════════════════════════════════════════════════════ */

const DATA_URL = 'data.json';
const STORAGE_KEY = 'fam_v3';
const NUTRIENT_KEYS = ['cal','fat','satFat','transFat','carbs','fiber','sugar','addedSugar','protein','sodium','refinedCarbs','caffeine'];
const EPS = 0.05;          // grams below this are rounding noise and are not drawn
const DEFAULT_MAX_QTY = 9;

/* Macro parts drawn in the energy bar, in display order (healthiest first
   within each family). kcal = Atwater energy per gram. */
const SEGMENTS = [
  { key:'fiber',         label:'Fiber',           group:'carb', kcal:2 },
  { key:'wholeStarch',   label:'Whole starch',    group:'carb', kcal:4 },
  { key:'natSugar',      label:'Natural sugar',   group:'carb', kcal:4 },
  { key:'refinedStarch', label:'Refined starch',  group:'carb', kcal:4 },
  { key:'addedSugar',    label:'Added sugar',     group:'carb', kcal:4 },
  { key:'unsatFat',      label:'Unsaturated fat', group:'fat',  kcal:9 },
  { key:'satFat',        label:'Saturated fat',   group:'fat',  kcal:9 },
  { key:'transFat',      label:'Trans fat',       group:'fat',  kcal:9 },
  { key:'plantProtein',  label:'Plant protein',   group:'prot', kcal:4 },
  { key:'animalProtein', label:'Animal protein',  group:'prot', kcal:4 },
];
const SEG = Object.fromEntries(SEGMENTS.map(s => [s.key, s]));
const CARB_KEYS = SEGMENTS.filter(s => s.group === 'carb').map(s => s.key);
const MACRO_GROUPS = [
  { key:'carb', label:'Carbs' },
  { key:'fat',  label:'Fat' },
  { key:'prot', label:'Protein' },
];

/* What each DAILY value in data.json means and where it comes from. */
const REFERENCE_INFO = {
  addedSugar:   { label:'Added sugar',    unit:'g',  kind:'limit',  refLabel:'daily limit',  basis:'American Heart Association maximum for men (25 g for women)' },
  satFat:       { label:'Saturated fat',  unit:'g',  kind:'limit',  refLabel:'daily limit',  basis:'American Heart Association: 5–6% of a 2,000-cal diet' },
  transFat:     { label:'Trans fat',      unit:'g',  kind:'limit',  refLabel:'daily limit',  basis:'WHO: under 1% of energy (≈2 g on 2,000 cal); ideally none' },
  refinedCarbs: { label:'Refined starch', unit:'g',  kind:'limit',  refLabel:'meal threshold', basis:'App heuristic for a “high” single meal — not an official limit' },
  sodium:       { label:'Sodium',         unit:'mg', kind:'limit',  refLabel:'daily max',    basis:'FDA Daily Value / Dietary Guidelines upper limit' },
  caffeine:     { label:'Caffeine',       unit:'mg', kind:'limit',  refLabel:'FDA ceiling',  basis:'FDA: amount not generally linked to adverse effects in healthy adults' },
  fiber:        { label:'Fiber',          unit:'g',  kind:'target', refLabel:'daily target', basis:'FDA Daily Value (14 g per 1,000 cal)' },
  protein:      { label:'Protein',        unit:'g',  kind:'target', refLabel:'daily target', basis:'RDA 0.8 g per kg × 80 kg (177 lb) body weight' },
};

/* ── numeric helpers ── */
const num = v => (typeof v === 'number' && Number.isFinite(v) ? v : 0);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const roundTo = (v, d = 0) => { const f = 10 ** d; return Math.round((v + Number.EPSILON) * f) / f + 0; };

const NF = [0, 1, 2].map(d => new Intl.NumberFormat('en-US', { minimumFractionDigits:d, maximumFractionDigits:d }));
/** 12.1 g · 2,300 mg · 540 · 76% — grams keep one decimal, everything else is whole. */
function fmtNum(v, unit = '', decimals) {
  const d = decimals ?? (unit === 'g' ? 1 : 0);
  const s = NF[d].format(roundTo(v, d));
  if (unit === '%') return `${s}%`;
  return unit ? `${s} ${unit}` : s;
}
/** Up to `d` decimals, trailing zeros dropped (used for score points). */
const fmtTrim = (v, d = 1) => String(roundTo(v, d));
const fmtSigned = v => (v > 0 ? `+${fmtTrim(v)}` : `−${fmtTrim(-v)}`);
const pctLabel = (p, raw) => (p === 0 && raw > 0 ? '<1%' : `${p}%`);
const fmtPortion = (qty, unit) => (qty === 1 ? `1 × ${unit}` : `${qty} × ${unit}`);

/** Largest-remainder rounding: integer percentages that always total 100. */
function roundPercents(values) {
  const total = values.reduce((a, b) => a + b, 0);
  if (!(total > 0)) return values.map(() => 0);
  const raw = values.map(v => (v / total) * 100);
  const out = raw.map(Math.floor);
  let left = 100 - out.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - out[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { out[i] += 1; left -= 1; } });
  return out;
}

/* ── per-serving decomposition ── */
/** Splits one serving into the ten macro parts. Every part is clamped so a
    food can never contribute negative grams, even with label rounding. */
function servingParts(item) {
  const fiber = Math.max(0, num(item.fiber));
  const sugar = Math.max(0, num(item.sugar));
  const addedSugar = clamp(num(item.addedSugar), 0, sugar);
  const starch = Math.max(0, num(item.carbs) - sugar - fiber);
  const refinedStarch = clamp(num(item.refinedCarbs), 0, starch);
  const satFat = Math.max(0, num(item.satFat));
  const transFat = Math.max(0, num(item.transFat));
  const unsatFat = Math.max(0, num(item.fat) - satFat - transFat);
  const protein = Math.max(0, num(item.protein));
  const animalProtein = protein * clamp(num(item.animalProtein), 0, 1);
  return {
    fiber, wholeStarch: starch - refinedStarch, natSugar: sugar - addedSugar, refinedStarch, addedSugar,
    unsatFat, satFat, transFat, plantProtein: protein - animalProtein, animalProtein,
  };
}

/* ── glycemic index & load ── */
const BANDS = {
  low:    { key:'low',    label:'Low',    tone:'good' },
  medium: { key:'medium', label:'Medium', tone:'warn' },
  high:   { key:'high',   label:'High',   tone:'bad'  },
};
/** GI bands: low ≤ 55, medium 56–69, high ≥ 70 (judged on the displayed whole number). */
function giBand(gi) { if (gi == null) return null; const r = Math.round(gi); return r <= 55 ? BANDS.low : r <= 69 ? BANDS.medium : BANDS.high; }
/** GL bands: low ≤ 10, medium 10–20, high ≥ 20 (judged on the displayed one-decimal value). */
function glBand(gl) { if (gl == null) return null; const r = roundTo(gl, 1); return r <= 10 ? BANDS.low : r < 20 ? BANDS.medium : BANDS.high; }

/** Available carbohydrate = total carbs − fiber (the basis of published GL values). */
const availableCarbs = item => Math.max(0, num(item.carbs) - num(item.fiber));

/** GI of 0 in data.json means "not applicable" (no meaningful carbs). */
function itemGlycemic(item) {
  const avail = availableCarbs(item);
  const gi = num(item.gi) > 0 && avail > 0 ? num(item.gi) : null;
  return { avail, gi, gl: gi == null ? null : (gi * avail) / 100 };
}

/** Meal GL = Σ GL; meal GI = carb-weighted mean GI over foods that have a GI. */
function computeGlycemic(lines) {
  let gl = 0, ratedCarbs = 0, unratedCarbs = 0;
  const rows = lines.map(({ item, qty }) => {
    const g = itemGlycemic(item);
    const avail = g.avail * qty;
    const lineGL = g.gi == null ? null : g.gl * qty;
    if (g.gi == null) unratedCarbs += avail; else { gl += lineGL; ratedCarbs += avail; }
    return { id:item.id, name:item.name, qty, gi:g.gi, avail, gl:lineGL, source:item.giSource || '', note:item.giNote || '' };
  });
  rows.sort((a, b) => (b.gl ?? -1) - (a.gl ?? -1));
  const gi = ratedCarbs > 0 ? (gl / ratedCarbs) * 100 : null;
  return {
    gi, gl, ratedCarbs, unratedCarbs, availCarbs: ratedCarbs + unratedCarbs, rows,
    hasRated: ratedCarbs > 0, giBand: giBand(gi), glBand: ratedCarbs > 0 ? glBand(gl) : null,
  };
}

/* ── warnings ── */
function computeFlags(lines) {
  const reasonOf = item => item.processedReason || item.note || '';
  const entry = (l, extra) => ({ id:l.item.id, name:l.item.name, qty:l.qty, ...extra });

  const hyd = lines.filter(l => l.item.hydrogenatedOil).map(l => entry(l, { reason: reasonOf(l.item) }));
  const trans = lines.filter(l => l.item.transFatRisk || num(l.item.transFat) > 0).map(l => entry(l, {
    reason: reasonOf(l.item),
    meta: num(l.item.transFat) > 0
      ? `≈${fmtNum(num(l.item.transFat) * l.qty, 'g')} trans fat in this meal (estimate)`
      : 'Trans fat possible below the 0.5 g labeling threshold',
  }));
  const processed = lines.filter(l => num(l.item.processed) >= 2)
    .map(l => entry(l, { severity: num(l.item.processed), reason: reasonOf(l.item) }))
    .sort((a, b) => b.severity - a.severity);
  const animal = lines.filter(l => l.item.animal).map(l => {
    const g = num(l.item.protein) * clamp(num(l.item.animalProtein), 0, 1) * l.qty;
    return entry(l, { reason:'Dairy or other animal-derived ingredients', meta: g >= EPS ? `≈${fmtNum(g, 'g')} animal protein in this meal` : null });
  });

  const list = [];
  if (hyd.length) list.push({ key:'hyd', label:'Hydrogenated oils', tone:'bad', items:hyd,
    detail:'Industrially hardened fats — a structure foreign to normal metabolism.' });
  if (trans.length) list.push({ key:'trans', label:'Trans-fat risk', tone:'bad', items:trans,
    detail:'US labels may show 0 g when a serving has under 0.5 g of trans fat. No level of industrial trans fat is considered safe (WHO).' });
  if (processed.some(p => p.severity >= 3)) list.push({ key:'upf', label:'Ultra-processed', tone:'warn', items:processed,
    detail:'Industrial ingredients detected. Foods at processing level 2–3, most severe first.' });
  if (animal.length) list.push({ key:'animal', label:'Animal-derived', tone:'neutral', items:animal,
    detail:'Contains dairy or other animal-derived ingredients.' });
  return { list, hasHyd: hyd.length > 0, hasTrans: trans.length > 0, transNames: trans.map(t => t.name), hydNames: hyd.map(h => h.name) };
}

/* ── quality score ── */
const SCORE_BASE = 60;
/* Each rule: when it applies, its effect, and the points it adds (d = density, g per 100 cal). */
const SCORE_RULES = [
  { id:'addedSugar', label:'Added sugar', when:'over 1 g per 100 cal', effect:'−6 per extra g, max −25',
    delta: c => (c.d.addedSugar > 1 ? -Math.min(25, (c.d.addedSugar - 1) * 6) : 0),
    detail: c => `${fmtNum(c.d.addedSugar, '', 2)} g per 100 cal` },
  { id:'satFat', label:'Saturated fat', when:'over 1 g per 100 cal', effect:'−5 per extra g, max −15',
    delta: c => (c.d.satFat > 1 ? -Math.min(15, (c.d.satFat - 1) * 5) : 0),
    detail: c => `${fmtNum(c.d.satFat, '', 2)} g per 100 cal` },
  { id:'refined', label:'Refined starch', when:'over 3 g per 100 cal', effect:'−2 per extra g, max −20',
    delta: c => (c.d.refined > 3 ? -Math.min(20, (c.d.refined - 3) * 2) : 0),
    detail: c => `${fmtNum(c.d.refined, '', 2)} g per 100 cal` },
  { id:'trans', label:'Trans-fat risk', when:'any selected food has trans-fat risk', effect:'−12',
    delta: c => (c.flags.hasTrans ? -12 : 0), detail: c => c.flags.transNames.join(', ') },
  { id:'hyd', label:'Hydrogenated oil', when:'any selected food contains hydrogenated oil', effect:'−6',
    delta: c => (c.flags.hasHyd ? -6 : 0), detail: c => c.flags.hydNames.join(', ') },
  { id:'wholeLow', label:'Low whole-food share', when:'whole food under 30% (−8) or 30–59% (−3)', effect:'−8 / −3',
    delta: c => (c.wholePct < 30 ? -8 : c.wholePct < 60 ? -3 : 0), detail: c => `${fmtNum(c.wholePct, '%')} whole food` },
  { id:'fiber', label:'Fiber', when:'2.5+ g per 100 cal (+10) or 1.5–2.49 (+5)', effect:'+10 / +5',
    delta: c => (c.d.fiber >= 2.5 ? 10 : c.d.fiber >= 1.5 ? 5 : 0), detail: c => `${fmtNum(c.d.fiber, '', 2)} g per 100 cal` },
  { id:'protein', label:'Protein', when:'4+ g per 100 cal', effect:'+5',
    delta: c => (c.d.protein >= 4 ? 5 : 0), detail: c => `${fmtNum(c.d.protein, '', 2)} g per 100 cal` },
  { id:'wholeHigh', label:'High whole-food share', when:'whole food 80% or more', effect:'+8',
    delta: c => (c.wholePct >= 80 ? 8 : 0), detail: c => `${fmtNum(c.wholePct, '%')} whole food` },
  { id:'clean', label:'Clean-label bonus', when:'no hydrogenated oil, no trans-fat risk and added sugar under 1 g per 100 cal', effect:'+5',
    delta: c => (!c.flags.hasHyd && !c.flags.hasTrans && c.d.addedSugar < 1 ? 5 : 0), detail: () => 'No hydrogenated oil, trans-fat risk or notable added sugar' },
];
const SCORE_MAX_REACHABLE = SCORE_BASE + 10 + 5 + 8 + 5;
const GRADES = [
  { min:80, grade:'A', label:'Clean fuel' },
  { min:65, grade:'B', label:'Decent' },
  { min:50, grade:'C', label:'Mediocre' },
  { min:35, grade:'D', label:'Damage mode' },
  { min:-Infinity, grade:'F', label:'Metabolic hit' },
];

function computeScore(ctx) {
  if (!(ctx.kcal > 0)) return null;                         // nothing to grade (e.g. stevia only)
  let raw = SCORE_BASE;
  const applied = [];
  for (const rule of SCORE_RULES) {
    const delta = rule.delta(ctx);
    if (delta) { raw += delta; applied.push({ id:rule.id, label:rule.label, detail:rule.detail(ctx), delta }); }
  }
  const value = clamp(Math.round(raw), 0, 100);
  return { value, raw, applied, ...GRADES.find(g => value >= g.min) };
}

/* ── “Watch these” (limits) and “Want more of” (targets) ── */
const LIMIT_METRICS = [
  { key:'addedSugar', seg:'addedSugar', value: m => m.parts.addedSugar,
    context: v => (v <= 4 ? 'Minimal' : v <= 12 ? 'Notable insulin response' : v <= 24 ? 'Liver fat production active' : 'Near daily limit') },
  { key:'satFat', seg:'satFat', value: m => m.parts.satFat,
    context: v => (v <= 3 ? 'Low' : v <= 6 ? 'Moderate' : v <= 10 ? 'LDL increasing' : 'Near daily limit') },
  { key:'refinedCarbs', seg:'refinedStarch', value: m => m.parts.refinedStarch,
    context: v => (v <= 5 ? 'Minimal' : v <= 20 ? 'Glucose spike likely' : 'Behaves like pure sugar') },
  { key:'transFat', seg:'transFat', value: m => m.parts.transFat,
    context: v => (v < 0.1 ? 'Negligible (trace)' : v < 1 ? 'Low but nonzero' : 'Significant — cardiovascular risk') },
  { key:'caffeine', value: m => m.totals.caffeine,
    context: v => (v <= 0 ? 'None' : v <= 100 ? 'Mild' : v <= 200 ? 'Moderate — cortisol elevated' : v <= 300 ? 'High — sleep impact' : 'Near FDA ceiling') },
  { key:'sodium', value: m => m.totals.sodium,
    context: v => (v <= 200 ? 'Low' : v <= 600 ? 'Moderate' : v <= 1000 ? 'High for one meal' : 'Very high') },
];
/** Limit bars: green ≤ 50% of the daily value, amber ≤ 75%, red above. */
const limitTone = pct => (pct <= 50 ? 'good' : pct <= 75 ? 'warn' : 'bad');

function buildLimits(m, daily) {
  return LIMIT_METRICS.filter(def => num(daily[def.key]) > 0).map(def => {
    const info = REFERENCE_INFO[def.key];
    const ref = num(daily[def.key]);
    const value = def.value(m);
    const pct = (value / ref) * 100;
    const over = value > ref;
    return {
      key:def.key, label:info.label, unit:info.unit, seg:def.seg, value, ref, pct, over, refLabel:info.refLabel,
      // Bar color tracks % of the daily value; the words describe this one meal, so they
      // stay neutral unless the daily value itself is exceeded.
      tone: limitTone(pct), contextTone: over ? 'bad' : 'neutral',
      context: over ? `Over ${info.refLabel}` : def.context(value),
      fills: [{ cls:`fill-${limitTone(pct)}`, width: Math.min(100, pct) }],
    };
  });
}

function buildTargets(m, daily) {
  const out = [];
  const fiberRef = num(daily.fiber);
  if (fiberRef > 0) {
    const v = m.parts.fiber, pct = (v / fiberRef) * 100;
    out.push({ key:'fiber', label:'Fiber', unit:'g', seg:'fiber', value:v, ref:fiberRef, pct, refLabel:'daily target',
      tone: v >= 8 ? 'good' : v >= 3 ? 'neutral' : 'warn',
      context: v >= 8 ? 'Strong — buffers glucose' : v >= 3 ? 'Some' : 'Low — glucose unbuffered',
      fills: [{ cls:'t-fiber', width: Math.min(100, pct) }] });
  }
  const protRef = num(daily.protein);
  if (protRef > 0) {
    const plant = m.parts.plantProtein, animal = m.parts.animalProtein, v = plant + animal, pct = (v / protRef) * 100;
    const scale = pct > 100 ? 100 / pct : 1;              // keep the stacked fill inside the track
    out.push({ key:'protein', label:'Protein', unit:'g', value:v, ref:protRef, pct, refLabel:'daily target',
      tone: v >= 15 ? 'good' : v >= 8 ? 'neutral' : 'warn',
      context: v >= 15 ? 'Strong — satiety, steadier energy' : v >= 8 ? 'Moderate' : 'Low — hunger returns sooner',
      detail: v < EPS ? null
        : animal < EPS ? 'All plant protein'
        : plant < EPS ? 'All animal protein'
        : `${fmtNum(plant, 'g')} plant · ${fmtNum(animal, 'g')} animal (${fmtNum((animal / v) * 100, '%')} animal)`,
      fills: [
        { cls:'t-plantProtein', width: (plant / protRef) * 100 * scale },
        { cls:'t-animalProtein', width: (animal / protRef) * 100 * scale },
      ] });
  }
  if (m.wholePct != null) {
    const v = m.wholePct;
    out.push({ key:'whole', label:'Whole food', unit:'%', value:v, ref:100, pct:v, refLabel:'whole-food meal',
      tone: v >= 70 ? 'good' : v >= 40 ? 'warn' : 'bad',
      context: v >= 70 ? 'Mostly whole foods' : v >= 40 ? 'Mixed' : 'Highly processed',
      fills: [{ cls:'fill-whole', width: clamp(v, 0, 100) }] });
  }
  return out;
}

/* ── carbohydrate charts ── */
function chartFromSegments(id, title, basis, segs, groups) {
  const visible = segs.filter(s => s.value >= EPS);
  const pcts = roundPercents(visible.map(s => s.value));
  visible.forEach((s, i) => { s.pct = pcts[i]; s.groupStart = i > 0 && visible[i - 1].group !== s.group; });
  const total = visible.reduce((a, s) => a + s.value, 0);
  let groupRows = null;
  if (groups) {
    const sums = groups.map((g, gi) => visible.filter(s => s.group === gi).reduce((a, s) => a + s.value, 0));
    const gp = roundPercents(sums);
    groupRows = groups.map((g, gi) => ({ ...g, value:sums[gi], pct:gp[gi] }));
  }
  return { id, title, basis, total, segments:visible, groups:groupRows };
}

function computeCarbCharts(parts, sources) {
  const total = CARB_KEYS.reduce((a, k) => a + parts[k], 0);
  if (total < EPS) return null;
  const byType = (id, title, groups) => chartFromSegments(id, title, 'share of carb grams, by carb type',
    groups.flatMap((g, gi) => g.keys.map(k => ({ key:k, label:SEG[k].label, value:parts[k], cls:`t-${k}`, group:gi }))),
    groups.map(g => ({ label:g.label, tone:g.tone })));
  return [
    byType('quality', 'Whole-food vs processed', [
      { label:'Whole-food', tone:'good', keys:['wholeStarch','fiber','natSugar'] },
      { label:'Processed',  tone:'bad',  keys:['refinedStarch','addedSugar'] },
    ]),
    byType('speed', 'Slow vs fast', [
      { label:'Slow', tone:'good', keys:['wholeStarch','fiber'] },
      { label:'Fast', tone:'warn', keys:['natSugar','refinedStarch','addedSugar'] },
    ]),
    chartFromSegments('source', 'By food group', 'share of carb grams, by the food they came from',
      sources.map(s => ({ key:s.name, label:s.name, icon:s.icon, value:s.carbs, cls:`cat-${s.index % 6}`, group:0, foods:s.foods })), null),
  ];
}

/* ── meal ── */
/** lines: [{ item, qty, category:{ name, icon, index } }] */
function computeMeal(lines, daily) {
  const totals = Object.fromEntries(NUTRIENT_KEYS.map(k => [k, 0]));
  const parts = Object.fromEntries(SEGMENTS.map(s => [s.key, 0]));
  const sources = new Map();
  let wholeCal = 0;
  for (const { item, qty, category } of lines) {
    for (const k of NUTRIENT_KEYS) totals[k] += num(item[k]) * qty;
    const sp = servingParts(item);
    for (const s of SEGMENTS) parts[s.key] += sp[s.key] * qty;
    wholeCal += num(item.cal) * qty * clamp(num(item.wholeFood), 0, 1);
    const src = sources.get(category.name) || { name:category.name, icon:category.icon, index:category.index, carbs:0, foods:[] };
    src.carbs += num(item.carbs) * qty;
    if (num(item.carbs) > 0) src.foods.push(item.name);
    sources.set(category.name, src);
  }
  const kcal = totals.cal;
  const per100 = g => (kcal > 0 ? (g / kcal) * 100 : 0);
  const wholePct = kcal > 0 ? (wholeCal / kcal) * 100 : null;
  const flags = computeFlags(lines);
  const d = { addedSugar:per100(parts.addedSugar), satFat:per100(parts.satFat), refined:per100(parts.refinedStarch),
              fiber:per100(parts.fiber), protein:per100(parts.plantProtein + parts.animalProtein) };
  const m = { lines, totals, parts, kcal, wholePct, flags, density:d };
  m.score = computeScore({ kcal, d, wholePct, flags });
  m.glycemic = computeGlycemic(lines);
  m.limits = buildLimits(m, daily);
  m.targets = buildTargets(m, daily);
  m.carbCharts = computeCarbCharts(parts, [...sources.values()].sort((a, b) => a.index - b.index));
  return m;
}

/* ── saved selections ── */
/** Drops ids that no longer exist in data.json and clamps servings to 1…max. */
function sanitizeQuantities(q, index) {
  const out = {};
  if (!q || typeof q !== 'object') return out;
  for (const [id, n] of Object.entries(q)) {
    const hit = index.get(id);
    if (!hit) continue;
    const max = num(hit.item.max) > 0 ? hit.item.max : DEFAULT_MAX_QTY;
    const v = clamp(Math.round(num(n)), 0, max);
    if (v > 0) out[id] = v;
  }
  return out;
}

/* ── data integrity checks (shown in Methodology, warned in the console) ── */
const TOL = 0.05;
const DATA_CHECKS = [
  { id:'carbs',   label:'Sugars + fiber ≤ total carbs',                 test: i => num(i.sugar) + num(i.fiber) <= num(i.carbs) + TOL },
  { id:'added',   label:'Added sugar ≤ total sugars',                   test: i => num(i.addedSugar) <= num(i.sugar) + TOL },
  { id:'fat',     label:'Saturated + trans fat ≤ total fat',            test: i => num(i.satFat) + num(i.transFat) <= num(i.fat) + TOL },
  { id:'refined', label:'Refined carbs ≤ starch (carbs − sugars − fiber)', test: i => num(i.refinedCarbs) <= num(i.carbs) - num(i.sugar) - num(i.fiber) + TOL },
  { id:'ranges',  label:'Fractions within 0–1, processing level 0–3, GI 0–110', test: i =>
      [i.wholeFood, i.animalProtein].every(v => num(v) >= 0 && num(v) <= 1) && num(i.processed) >= 0 && num(i.processed) <= 3 && num(i.gi) >= 0 && num(i.gi) <= 110 },
  { id:'animal',  label:'Foods with animal protein are flagged animal-derived', test: i => !(num(i.animalProtein) > 0) || i.animal === true },
  { id:'energy',  label:'Label calories match macros (within 15% or 5 cal)', test: i => {
      const atwater = 4 * (num(i.carbs) - num(i.fiber)) + 2 * num(i.fiber) + 9 * num(i.fat) + 4 * num(i.protein);
      return Math.abs(atwater - num(i.cal)) <= Math.max(5, 0.15 * num(i.cal)); } },
  { id:'gl',      label:'Stored GL = GI × available carbs ÷ 100',       test: i => i.gl == null || Math.abs(num(i.gl) - num(itemGlycemic(i).gl)) < 0.06 },
];
function runDataChecks(data) {
  const items = data.CATEGORIES.flatMap(c => c.items);
  const seen = new Set(), dupes = [];
  items.forEach(i => { if (seen.has(i.id)) dupes.push(i.name); seen.add(i.id); });
  const results = [{ id:'ids', label:'Every food has a unique id', failures:dupes }]
    .concat(DATA_CHECKS.map(c => ({ id:c.id, label:c.label, failures: items.filter(i => !c.test(i)).map(i => i.name) })));
  return { foods: items.length, results, failed: results.filter(r => r.failures.length).length };
}

function Chip({ tone = 'neutral', title, children }) {

/** Hover (mouse) or tap (touch/pen) tooltip, rendered into <body>. */
function useTooltip() {
  const [tip, setTip] = useState(null);
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);
  const bind = text => ({
    onPointerMove: e => { if (e.pointerType === 'mouse') setTip({ x:e.clientX, y:e.clientY, text }); },
    onPointerLeave: e => { if (e.pointerType === 'mouse') setTip(null); },
    onPointerDown: e => {
      if (e.pointerType === 'mouse') return;
      setTip({ x:e.clientX, y:e.clientY, text });
      clearTimeout(timer.current);
      timer.current = setTimeout(() => setTip(null), 2200);
    },
  });
  return [tip, bind];
}
function Tooltip({ tip }) {
  if (!tip) return null;
  const x = clamp(tip.x, 120, Math.max(120, window.innerWidth - 120));
  return ReactDOM.createPortal(<div className="tip" role="tooltip" style={{ left:x, top:tip.y }}>{tip.text}</div>, document.body);
}

/** Proportional bar. segments: [{ key, cls, weight, groupStart, tip }] */
function StackedBar({ segments, size = 'md', label }) {
  const [tip, bind] = useTooltip();
  return (
    <>
      <div className={`stack stack-${size}`} role="img" aria-label={label}>
        {segments.map(s => (
          <span key={s.key} className={`seg ${s.cls}${s.groupStart ? ' grp-start' : ''}`} style={{ flexGrow:s.weight }} {...bind(s.tip)} />
        ))}
      </div>
      <Tooltip tip={tip} />
    </>
  );
}

/** Energy split by macro sub-type (fiber 2, carbs/protein 4, fat 9 cal per g). */
function MacroBar({ parts, size = 'lg' }) {
  const segs = SEGMENTS.map(s => ({ ...s, g: parts[s.key], kcal: parts[s.key] * s.kcal })).filter(s => s.g >= EPS);
  const total = segs.reduce((a, s) => a + s.kcal, 0);
  if (!(total > 0)) return <p className="p-note">No meaningful protein, fat or carbohydrate.</p>;
  const pcts = roundPercents(segs.map(s => s.kcal));
  segs.forEach((s, i) => { s.pct = pcts[i]; });
  const groupName = Object.fromEntries(MACRO_GROUPS.map(g => [g.key, g.label]));
  const bar = segs.map((s, i) => ({
    key:s.key, cls:`t-${s.key}`, weight:s.kcal, groupStart: i > 0 && segs[i - 1].group !== s.group,
    tip:`${groupName[s.group]} › ${s.label}: ${fmtNum(s.g, 'g')} · ${pctLabel(s.pct, s.kcal)} of energy`,
  }));
  const label = 'Energy split: ' + segs.map(s => `${s.label} ${fmtNum(s.g, 'g')}, ${pctLabel(s.pct, s.kcal)}`).join('; ');
  return (
    <div>
      <StackedBar segments={bar} size={size} label={label} />
      <div className="legend">
        {MACRO_GROUPS.map(g => {
          const gs = segs.filter(s => s.group === g.key);
          if (!gs.length) return null;
          const grams = gs.reduce((a, s) => a + s.g, 0);
          const pct = gs.reduce((a, s) => a + s.pct, 0);
          return (
            <div className="legend-row" key={g.key}>
              <div className={`legend-group lg-${g.key}`}>{g.label}<small className="num">{fmtNum(grams, 'g')} · {pct}%</small></div>
              <ul className="legend-items">
                {gs.map(s => (
                  <li key={s.key}>
                    <Swatch cls={`t-${s.key}`} />
                    <span>{s.label}</span>
                    <span className="v">{fmtNum(s.g, 'g')}</span>
                    <span className="p">{pctLabel(s.pct, s.kcal)}</span>
                  </li>
                ))}
              </ul>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MetricRow({ m }) {

function ScoreBreakdown({ score }) {
  const rounded = Math.round(score.raw);
  const note = score.raw < 0 ? `Raw total ${fmtTrim(score.raw)} is floored at 0.`

  return (
    <div>
      <table className="score-table">
        <caption className="sr-only">How the quality score was calculated</caption>

function Modal({ titleId, title, onClose, children }) {
  const boxRef = useRef(null), closeRef = useRef(null), onCloseRef = useRef(onClose);
  onCloseRef.current = onClose;
  useEffect(() => {
    const opener = document.activeElement;
    closeRef.current && closeRef.current.focus();
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); onCloseRef.current(); return; }
      if (e.key !== 'Tab' || !boxRef.current) return;
      const f = boxRef.current.querySelectorAll('a[href],button:not([disabled]),[tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = prevOverflow;
      if (opener && opener.focus) opener.focus();
    };
  }, []);
  return ReactDOM.createPortal(
    <div className="modal-backdrop" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div ref={boxRef} className="modal ink" role="dialog" aria-modal="true" aria-labelledby={titleId}>
        <div className="modal-head">
          <h2 id={titleId}>{title}</h2>
          <button ref={closeRef} type="button" className="icon-btn" aria-label="Close" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>,
    document.body
  );
}
